name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      only_stage:
        description: Run only a named build stage; every stage-only dispatch needs the restored toolchain cache
        required: true
        type: choice
        options:
          - all
          - fex-ios
          - wineserver
          - wine-ntdll-unix
        default: all
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    name: Track A sideload JIT build
    # The project requires Xcode, Metal tooling, and the iOS SDK.
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout pinned source tree
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: false
          fetch-depth: 1

      # Two different versions come out of this Xcode and both are correct: the
      # installation (26.6, build 17F113) and the iPhoneOS SDK that ships inside
      # it (iphoneos26.5 — the macOS 26 runner image lists Xcode 26.6 under the
      # iOS 26.5 SDK). They are checked here, not merely printed: a future image
      # that ships a different Xcode fails by name in this step instead of
      # somewhere inside the build, and the SDK the compile actually uses is the
      # one that was verified.
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          requested=/Applications/Xcode_26.6.app/Contents/Developer
          if [[ ! -d "$requested" ]]; then
            echo "error: $requested is not installed; this image has:" >&2
            ls -d /Applications/Xcode*.app >&2 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$requested"
          xcode_version="$(xcodebuild -version | sed -n 1p)"
          xcode_build="$(xcodebuild -version | sed -n 's/^Build version //p')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Xcode version   (xcodebuild -version): $xcode_version ($xcode_build)"
          echo "iPhoneOS SDK    (xcrun --sdk iphoneos --show-sdk-version): $sdk_version at $sdk_path"
          if [[ "$xcode_version" != "Xcode 26.6" ]]; then
            echo "error: expected Xcode 26.6, selected '$xcode_version'; the pinned configure and every stage compile are made with it" >&2
            exit 1
          fi
          if [[ ! -d "$sdk_path" ]]; then
            echo "error: the iPhoneOS SDK path $sdk_path does not exist" >&2
            exit 1
          fi
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]] || (( sdk_major < 17 )); then
            echo "error: the iPhoneOS SDK is $sdk_version; the stages compile with -miphoneos-version-min=17.0" >&2
            exit 1
          fi

      - name: Install pinned build tools
        run: |
          brew install cmake ninja meson bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # The cache holds build products, never sources: `Bootstrap pinned sources
      # and toolchains` below runs on every full dispatch (`all`, including the
      # push event, where only_stage is unset) — a warm cache makes it cheap and
      # it is what validates and repairs the restored trees — while the save is
      # skipped when the exact key is already there (actions/cache/save cannot
      # reserve a key that exists). A stage-only dispatch skips both and instead
      # requires the cache to have been restored: it fetches only the submodules
      # its own stage needs.
      - name: Cache pinned toolchains
        id: toolchain-cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: winephone-macos26-llvm-8dfdcc7b7bf66834a761bd8de445840ef68e4d1a-llvm-mingw-20260421-v1

      - name: Report toolchain cache restore
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinned toolchain cache exact-key hit: ${{ steps.toolchain-cache.outputs.cache-hit }}"
          for d in toolchains/llvm-project toolchains/llvm-host-build toolchains/llvm-ios-build \
                   toolchains/llvm-mingw-20260421-ucrt-macos-universal; do
            if [ -d "$d" ]; then
              echo "  present: $d ($(find "$d" -type f | wc -l | tr -d ' ') files)"
            else
              echo "  MISSING: $d"
            fi
          done
          if [[ "${{ inputs.only_stage || 'all' }}" != "all" ]]; then
            if [[ "${{ steps.toolchain-cache.outputs.cache-hit }}" != "true" ]]; then
              echo "error: a stage-only dispatch requires the restored pinned toolchain cache" >&2
              exit 1
            fi
          fi

      # scripts/bootstrap.sh validates every restored tree against the artifact
      # its consumers use (llvm-tblgen, llvm-config.h + lib/*.a, the git checkout
      # at the pin) and rebuilds only what is absent or at another revision, so a
      # cache hit is cheap and a damaged cache still ends complete.
      - name: Bootstrap pinned sources and toolchains
        if: (inputs.only_stage || 'all') == 'all'
        run: bash scripts/bootstrap.sh

      - name: Save toolchain cache after bootstrap
        if: (inputs.only_stage || 'all') == 'all' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: winephone-macos26-llvm-8dfdcc7b7bf66834a761bd8de445840ef68e4d1a-llvm-mingw-20260421-v1

      # FreeType is not built by bootstrap and is not in the LLVM toolchain
      # cache; it gets its own key so this never invalidates the ~35-minute LLVM
      # cache. build/ntdll-unix/build.sh needs it for dwrite and
      # build/win32u-unix/build.sh links libfreetype.a into libwin32u_unix.a.
      - name: Cache pinned FreeType
        id: freetype-cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0
        with:
          path: |
            research/freetype
            build/freetype-ios/build
          key: winephone-freetype-2.13.3-42608f77f20749dd6ddc9e0536788eaad70ea4b5-v1

      - name: Report FreeType cache restore
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinned FreeType cache exact-key hit: ${{ steps.freetype-cache.outputs.cache-hit }}"
          for f in research/freetype/include/ft2build.h \
                   build/freetype-ios/build/include/freetype/config/ftconfig.h \
                   build/freetype-ios/build/include/freetype/config/ftoption.h \
                   build/freetype-ios/build/libfreetype.a; do
            if [ -e "$f" ]; then echo "  present: $f"; else echo "  MISSING: $f"; fi
          done

      - name: Build FreeType for iOS
        if: steps.freetype-cache.outputs.cache-hit != 'true'
        run: bash build/freetype-ios/build.sh

      - name: Save FreeType cache after build
        if: steps.freetype-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            research/freetype
            build/freetype-ios/build
          key: winephone-freetype-2.13.3-42608f77f20749dd6ddc9e0536788eaad70ea4b5-v1

      - name: Build and package unsigned IPA
        id: ipa
        run: bash scripts/build-ipa.sh artifacts
        env:
          WINEPHONE_SKIP_BOOTSTRAP: '1'
          WINEPHONE_ONLY_STAGE: ${{ inputs.only_stage || 'all' }}
          # Printed by build/ntdll-unix/build.sh's header diagnostic: a
          # stage-only dispatch is required to have the pinned toolchain cache.
          WINEPHONE_TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}

      # What the step above actually produced. scripts/build-ipa.sh writes
      # artifacts/build-status.txt (IPA_PRESENT=1 with the path, arch and hash on
      # the full path; IPA_PRESENT=0 for a stage-only dispatch). A green build
      # step must not be read as an IPA.
      - name: Report build result
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/build-status.txt ]; then
            cat artifacts/build-status.txt
          else
            echo "error: scripts/build-ipa.sh wrote no artifacts/build-status.txt" >&2
            exit 1
          fi

      - name: Verify unsigned IPA and hash
        if: vars.WINEPHONE_BINARY_RELEASE_CLEARED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/WinePhone-unsigned.ipa
          test -f artifacts/SHA256SUMS
          # The hash that is uploaded next to the IPA must be the hash of that
          # IPA, verified here on the exact file the upload step reads.
          shasum -a 256 -c artifacts/SHA256SUMS

      - name: Report stage-only run
        if: (inputs.only_stage || 'all') != 'all'
        run: |
          echo "stage-only dispatch (${{ inputs.only_stage }}): this run builds and reports one stage and produces no IPA."
          echo "It is a green build of that stage, not a validated package. Run with only_stage=all to build the IPA."

      - name: Upload unsigned IPA and hash
        if: vars.WINEPHONE_BINARY_RELEASE_CLEARED == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: WinePhone-unsigned-IPA
          path: |
            artifacts/WinePhone-unsigned.ipa
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence
        if: vars.WINEPHONE_BINARY_RELEASE_CLEARED == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: WinePhone-build-evidence
          path: |
            artifacts/SHA256SUMS
            artifacts/build-environment.txt
            artifacts/build-status.txt
            artifacts/Payload/Madeira.app/Info.plist
          if-no-files-found: error
          retention-days: 14

      - name: Report binary distribution gate
        if: vars.WINEPHONE_BINARY_RELEASE_CLEARED != 'true'
        run: echo "IPA validation completed, but artifact publication is gated pending license/relink review. See LICENSES/PROVENANCE.md."

  # The repository's regression suite (~150 checks under tests/host). Several of
  # them assert their own presence in this workflow, and until this job existed
  # nothing ran them: the build job only builds. A check that needs the wine,
  # DXMT or FEX submodules or a Swift toolchain cannot run here (this job checks
  # out no submodules and the runner has no swiftc), so it is not listed; those
  # are run locally/by hand until they are wired into a macOS job.
  host-checks:
    name: Host regression checks
